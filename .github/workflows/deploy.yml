name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Runs before the deploy, so a broken waitlist contract never reaches
      # prod. The smoke test below only runs after — by then the damage is live.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_CF_BEACON: ${{ secrets.NEXT_PUBLIC_CF_BEACON }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=lumi --branch=main

      - name: Smoke test
        env:
          APEX_URL: "https://lumi.estate/"
          WAITLIST_URL: "https://lumi.estate/api/waitlist"
        run: |
          set -e
          # CF Pages Functions take a while to propagate to the edge after a
          # deploy — poll instead of a single fixed sleep to avoid flaky fails.
          sleep 20

          echo "-> apex"
          code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "$APEX_URL")
          if [ "$code" != "200" ]; then
            echo "FAIL: apex returned HTTP $code"
            exit 1
          fi

          echo "-> waitlist GET (poll until propagated)"
          ok=""
          for i in $(seq 1 12); do
            body=$(curl -s -m 15 "$WAITLIST_URL" || true)
            if echo "$body" | grep -q '"ok":true'; then
              ok="1"
              break
            fi
            echo "attempt $i: not ready ($body) — waiting 10s"
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "FAIL: waitlist API never returned ok:true (last: $body)"
            exit 1
          fi

          echo "smoke test passed"
