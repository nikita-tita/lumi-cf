name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_CF_BEACON: ${{ secrets.NEXT_PUBLIC_CF_BEACON }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=lumi --branch=main

      - name: Smoke test
        env:
          APEX_URL: "https://lumi.estate/"
          WAITLIST_URL: "https://lumi.estate/api/waitlist"
        run: |
          set -e
          # CF Pages needs ~20-30s to propagate after deploy completes
          sleep 30

          echo "-> apex"
          code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "$APEX_URL")
          if [ "$code" != "200" ]; then
            echo "FAIL: apex returned HTTP $code"
            exit 1
          fi

          echo "-> waitlist GET"
          body=$(curl -s -m 15 "$WAITLIST_URL")
          if echo "$body" | grep -q '"degraded":true'; then
            echo "FAIL: waitlist API is in degraded mode (Supabase down?)"
            echo "Response: $body"
            exit 1
          fi
          if ! echo "$body" | grep -q '"count"'; then
            echo "FAIL: waitlist API returned unexpected body"
            echo "Response: $body"
            exit 1
          fi

          echo "smoke test passed"
