name: Add demo.lumi.estate DNS

on:
  workflow_dispatch: {}

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: lumi.estate
        run: |
          set -euo pipefail

          api() {
            curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$@"
          }

          zone_id="$(api "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" | jq -r '.result[0].id // empty')"
          if [ -z "$zone_id" ]; then
            echo "Cloudflare zone not found: ${ZONE_NAME}"
            exit 1
          fi

          upsert_record() {
            local type="$1"
            local name="$2"
            local content="$3"
            local proxied="${4:-false}"

            existing_id="$(api "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=${type}&name=${name}" | jq -r '.result[0].id // empty')"
            body="$(jq -nc \
              --arg type "$type" \
              --arg name "$name" \
              --arg content "$content" \
              --argjson proxied "$proxied" \
              '{type:$type,name:$name,content:$content,ttl:1,proxied:$proxied}')"

            if [ -n "$existing_id" ]; then
              api -X PUT --data "$body" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${existing_id}" >/dev/null
              echo "Updated ${type} ${name}"
            else
              api -X POST --data "$body" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" >/dev/null
              echo "Created ${type} ${name}"
            fi
          }

          upsert_record CNAME demo.lumi.estate custom-domains.chatgpt.site false
          upsert_record TXT _openai-site-verification.demo.lumi.estate "openai-site-verification=9vYkVZL8Z5xypSl_F2FWevga4eQbo8PACvhOWxoXVTA" false
          upsert_record TXT _cf-custom-hostname.demo.lumi.estate "3c41d754-914b-4164-a194-04d0393326f0" false
