name: Sync Pages function secrets

# Pushes runtime secrets from GitHub repo secrets into the Cloudflare Pages
# project "lumi" (Functions env). Run manually after adding or rotating a
# secret. Values never appear in logs — wrangler reads them from stdin.

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Push Telegram secrets to Pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          npm install -g wrangler@latest
          printf '%s' "$TELEGRAM_BOT_TOKEN" | wrangler pages secret put TELEGRAM_BOT_TOKEN --project-name=lumi
          printf '%s' "$TELEGRAM_CHAT_ID" | wrangler pages secret put TELEGRAM_CHAT_ID --project-name=lumi

      # Email delivery channel (Resend). Optional — skipped when RESEND_API_KEY
      # repo secret is empty. OWNER_EMAIL overrides the hello@lumi.estate default.
      - name: Push email secrets to Pages
        if: ${{ secrets.RESEND_API_KEY != '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          printf '%s' "$RESEND_API_KEY" | wrangler pages secret put RESEND_API_KEY --project-name=lumi
          if [ -n "$OWNER_EMAIL" ]; then
            printf '%s' "$OWNER_EMAIL" | wrangler pages secret put OWNER_EMAIL --project-name=lumi
          fi
